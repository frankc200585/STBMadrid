<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>STB Madrid — Volvemos enseguida</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --text: #f2f4f8;
    --muted: #a2abbb;
    --accent: #c9a227;
    --line: #262b35;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  .mark {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 28px;
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(26px, 5vw, 34px);
    line-height: 1.2;
    font-weight: 650;
  }
  p {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
  }
  .contact {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-size: 15px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <span class="mark">STB Madrid</span>
    <h1>Estamos realizando tareas de mantenimiento</h1>
    <p>La web no está disponible temporalmente. Volveremos a estar en línea en breve.</p>
    <p>Gracias por tu paciencia.</p>
    <div class="contact">
      ¿Necesitas contactarnos? <a href="mailto:frankc200585@gmail.com">Escríbenos</a>
    </div>
  </main>
</body>
</html>
