# ============================================================
# STB Madrid — Modo mantenimiento (Nginx / VPS)
#
# Usa un "fichero interruptor": mientras exista /etc/nginx/maintenance.on
# la web esta cerrada. Al borrarlo vuelve al instante, SIN recargar nginx.
#
# USO:
#   1. Deja maintenance.html en la raiz del sitio.
#   2. Pega este bloque dentro del "server { ... }" del sitio,
#      antes del resto de "location".
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Activar el cierre:   sudo touch /etc/nginx/maintenance.on
#
# REAPERTURA AUTOMATICA el miercoles 2/09/2026 a las 08:00:
#   echo 'rm -f /etc/nginx/maintenance.on' | sudo at 08:00 2026-09-02
#
# REABRIR A MANO EN CUALQUIER MOMENTO:
#   sudo rm -f /etc/nginx/maintenance.on
# ============================================================

set $maintenance 0;

if (-f /etc/nginx/maintenance.on) {
    set $maintenance 1;
}

# Tu IP publica: opcional, para poder seguir viendo la web tu mismo
if ($remote_addr = "0.0.0.0") {
    set $maintenance 0;
}

if ($maintenance = 1) {
    return 503;
}

error_page 503 @maintenance;

location @maintenance {
    root /var/www/stbmadrid;      # ruta donde este maintenance.html
    rewrite ^ /maintenance.html break;
    add_header Retry-After 86400 always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
