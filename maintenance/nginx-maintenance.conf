# ============================================================
# STB Madrid — Modo mantenimiento (Nginx)
#
# USO: incluye este bloque dentro del "server { ... }" del sitio,
#      antes del resto de "location". Luego: nginx -t && systemctl reload nginx
#
# PARA QUITAR EL BLOQUEO: comenta o borra el bloque y recarga nginx.
# ============================================================

set $maintenance 1;

# Tu IP publica: sustituye por la real para poder seguir viendo la web
if ($remote_addr = "0.0.0.0") {
    set $maintenance 0;
}

if ($maintenance = 1) {
    return 503;
}

error_page 503 @maintenance;

location @maintenance {
    root /var/www/stbmadrid;      # ruta donde dejes maintenance.html
    rewrite ^ /maintenance.html break;
    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
